name: C/C++ CI

on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['windows-2019']
        include: 
          # - os: ubuntu-22.04
          #   ARTIFACT_NAME: openSSL_3_5_0_ubuntu22
          #   UNZIP_COMMAND: unzip -qa
          #   ZIP_COMMAND: zip -r
          # - os: ubuntu-24.04
          #   ARTIFACT_NAME: openSSL_3_5_0_ubuntu24
          #   UNZIP_COMMAND: unzip -qa
          #   ZIP_COMMAND: zip -r
          - os: windows-2019
            ARTIFACT_NAME: openSSL_3_5_0_win2019
            UNZIP_COMMAND: 7z x
            ZIP_COMMAND: 7z a -r
          # - os: windows-2025
          #   ARTIFACT_NAME: openSSL_3_5_0_win2025
          #   UNZIP_COMMAND: 7z x
          #   ZIP_COMMAND: 7z a -r
          # - os: macos-12
          #   ARTIFACT_NAME: openSSL_1_1_1w_mac12
          #   UNZIP_COMMAND: unzip -qa
          #   ZIP_COMMAND: zip -r
          # - os: macos-13
          #   ARTIFACT_NAME: openSSL_1_1_1w_mac13
          #   UNZIP_COMMAND: unzip -qa
          #   ZIP_COMMAND: zip -r
          # - os: macos-14
          #   ARTIFACT_NAME: openSSL_1_1_1w_mac14
          #   UNZIP_COMMAND: unzip -qa
          #   ZIP_COMMAND: zip -r
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ilammy/setup-nasm@v1
      - name: Download sources
        run: |
          curl -L https://github.com/openssl/openssl/archive/refs/tags/openssl-3.5.0.zip -o openSSL.zip
          ${{matrix.UNZIP_COMMAND}} openSSL.zip
          mv openssl-openssl-3.5.0 openSSL
      - name: Install perl for windows build
        run: |
          choco install strawberryperl
          perl --version
          set CC=
          set CC_FOR_BUILD=
          set CXX=
          set CXX_FOR_BUILD=
        shell: cmd
        if: runner.os	== 'Windows'
      - name: Build Windows
        run: |
          cd openSSL
          set PATH=%PATH%;"C:\Program Files\NASM"
          C:\Strawberry\perl\bin\perl.exe Configure VC-WIN64A
          nmake
          dir
          cd ..
          mkdir artifact
          robocopy openSSL\include artifact\include /e
          copy openSSL\libcrypto-1_1-x64.dll artifact
          copy openSSL\libcrypto.lib artifact
          copy openSSL\libssl-1_1-x64.dll artifact
          copy openSSL\libssl.lib artifact
        shell: cmd
        if: runner.os	== 'Windows'
      - name: Build Mac
        run: |
          mkdir dist
          cd openSSL
          pwd
          ls
          ./Configure --prefix=$PWD/dist shared darwin64-x86_64-cc
          make depend
          make -j 2
          cd ..
          mkdir artifact
          cp -R openSSL/include artifact
          cp openSSL/libcrypto.1.1.dylib openSSL/libcrypto.a openSSL/libcrypto.dylib openSSL/libssl.1.1.dylib openSSL/libssl.a openSSL/libssl.dylib artifact
        if: runner.os	== 'macOS'
      - name: Build Linux
        run: |
          cd openSSL
          ./Configure shared
          make -j 2
          cd ..
          mkdir artifact
          cp -R openSSL/include artifact
          cp openSSL/libcrypto.* openSSL/libssl.* artifact
        if: runner.os	== 'Linux'
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.ARTIFACT_NAME}}
          path: artifact
      - name: Zip files
        run: |
          cd artifact
          ${{matrix.ZIP_COMMAND}} ../${{matrix.ARTIFACT_NAME}}.zip *
          cd ..
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{matrix.ARTIFACT_NAME}}.zip

  # How to upload files to the release:
  # https://github.com/Blacksmoke16/oq/pull/47/files#diff-082c28d748ad2e3eecc5508d740d9417R9-R29
  # This is something but is looks ugly
  # https://github.com/actions/upload-release-asset/issues/17